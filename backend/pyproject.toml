[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "satquery-backend"
version = "0.1.0"
description = "SatQuery AI - Foundation & Geospatial Ingestion Backend"
readme = "README.md"
authors = [{ name = "SatQuery AI Team", email = "satquery@isro.gov.in" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "rasterio>=1.3.9",
    "numpy>=1.26.0",
    "Pillow>=10.2.0",
    "pyproj>=3.6.1",
    "SQLAlchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "minio>=7.2.5",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "coverage>=7.4.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", ".."]
